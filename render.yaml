services:
  - type: web
    name: whatsapp-chatter-fullstack
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build && pnpm predeploy
    startCommand: pnpm serve
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        sync: false